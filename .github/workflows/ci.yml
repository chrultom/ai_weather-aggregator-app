name: Python CI - Code Quality & Unit Tests

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
    # 1. Check out repository code
    - name: Checkout repository
      uses: actions/checkout@v7

    # 2. Set up Python 3.14 environment
    - name: Set up Python 3.14
      uses: actions/setup-python@v7
      with:
        python-version: "3.14"
        cache: 'pip'

    # 3. Install dependencies from requirements.txt (including ruff)
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        if [ -f requirements.txt ]; then pip install -r requirements.txt; fi

    # 4. Check code quality and formatting with Ruff
    - name: Run Ruff linter and format check
      run: |
        ruff check .
        ruff format --check .

    # 5. Run unit tests with Python unittest
    - name: Run unit tests
      run: |
        python -m unittest discover -s . -p "test_*.py"
